apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aulaviva-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/KulkatPOP/Equipo-AulaViva-gitops.git
    targetRevision: main
    path: overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: aulaviva-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
